name: regulations-sync

# JAF サイトを巡回し、更新された PDF だけを HTML 化してコミットする。
#  - JAF の PDF には ETag も Last-Modified も無いため、
#    「一覧ページのアップロード日」→「本体の SHA-256」の 2 段で差分を見る。
#  - 生成物（content/ と data/）だけをコミットし、PDF 原本はコミットしない。
#  - 年度が変わると JAF は別ファイルとして公開するため、こちらでは新規追加に
#    見える。系列キー（jafreg/series.py）で束ねて更新履歴に出す。

on:
  schedule:
    # 毎週月曜 03:10 JST（= 日曜 18:10 UTC）。JAF の更新は平日日中に
    # 集まるので、月曜の未明に回すと前週分をまとめて拾える。
    # 週の途中に更新されて週内に再更新された場合、間の版は追えない。
    - cron: "10 18 * * 0"
  workflow_dispatch:
    inputs:
      limit:
        description: "先頭 N 件だけ処理（0 = 全件）"
        required: false
        default: "0"
      only:
        description: "特定の docId だけ処理（スペース区切り）"
        required: false
        default: ""
      force:
        description: "差分に関係なく再変換する"
        type: boolean
        required: false
        default: false
      ocr:
        description: "テキスト層の無いページを OCR する"
        type: boolean
        required: false
        default: false

concurrency:
  group: regulations-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write   # 更新があったとき Issue で通知する（デプロイは手動のまま）

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: 依存関係
        run: pip install -r pipeline/requirements.txt

      - name: テスト
        run: |
          python tests/test_catalog.py
          python tests/test_announcements.py
          python tests/test_seo.py
          python tests/test_search.py

      - name: OCR ツール（任意）
        if: ${{ inputs.ocr == true }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-jpn tesseract-ocr-jpn-vert
          echo "TESSDATA_PREFIX=/usr/share/tesseract-ocr/5/tessdata" >> "$GITHUB_ENV"

      # 公示一覧。諸規則一覧のアップロード日より約 1 か月早く更新が出るので、
      # 先に取っておく。詳細ページは新しい規則変更のぶんだけ開く。
      - name: 公示一覧を巡回
        run: python pipeline/cli.py announcements

      - name: 巡回・差分検出・変換
        run: |
          python pipeline/cli.py \
            ${{ inputs.ocr == true && '--ocr' || '' }} \
            sync \
            --limit "${{ inputs.limit || 0 }}" \
            ${{ inputs.force == true && '--force' || '' }} \
            ${{ inputs.only != '' && format('--only {0}', inputs.only) || '' }} \
            | tee sync.log

      # 更新履歴を組み立てる。state.json と changes/*.json だけを見るので
      # PDF は読み直さない。「JAF が更新した」と「こちらが再変換した」を
      # 区別するのはここ（uploadDate が変わったかで判定する）。
      - name: 更新履歴を生成
        run: python pipeline/build_history.py

      # 条単位の改正差分。前の版（previous.json）と前年度版の両方を相手にする。
      # PDF は読み直さないので数秒で終わる。
      - name: 改正差分を生成
        run: python pipeline/build_diffs.py

      # 公示 → 規則系列の紐づけ。build_index.py がこれを docs テーブルに
      # 取り込み、規則ページに「JAF の公示」と対比表 PDF への案内を出す。
      #
      # このステップは当初から抜けていた（2026-09-11 に気づいて追加）。
      # 「公示一覧を巡回」で announcements.json は毎回更新されるのに、
      # 紐づけを作り直していなかったので、公示が増えても規則に届かなかった。
      # 実際に 439 → 1,188 件まで遡れたときも、紐づけは 55 系列のまま
      # （作り直すと 63 系列）だった。
      - name: 公示を規則に紐づける
        run: python pipeline/link_announcements.py

      - name: 変更サマリ
        if: always()
        run: |
          {
            echo "## JAF 諸規則 同期結果"
            echo '```'
            tail -n 40 sync.log 2>/dev/null || echo "(ログなし)"
            echo '```'
            latest=$(ls -1 data/changes/*.json 2>/dev/null | tail -1)
            if [ -n "$latest" ]; then
              echo "### 差分 ($latest)"
              echo '```json'
              python -c "import json,sys;d=json.load(open(sys.argv[1]));print(json.dumps({k:d[k] for k in ('added','updated','removed','failed') if k in d},ensure_ascii=False,indent=1)[:4000])" "$latest"
              echo '```'
            fi
            # 週次で誰も見ていないので、人が読む要約もここに出す
            python pipeline/build_history.py --github-summary --days 14 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: コミット
        id: commit
        run: |
          git config user.name "jaf-regulations-bot"
          git config user.email "actions@github.com"
          # data/embeddings.sqlite は .gitignore 済み（実体は GCS）。
          # data/history.json と data/embeddings.manifest.json は入る。
          git add -A content data
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          python pipeline/commit_message.py > /tmp/commitmsg.txt
          git commit -F /tmp/commitmsg.txt
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # デプロイは自動化しない（規則の内容が変わるので、公開は人が判断する）。
      # 代わりに Issue を立てて GitHub からメールが届くようにする。
      # 追加のサービスもシークレットも要らない。
      - name: 更新を通知する
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "JAF の諸規則が更新されたので、生成物を更新してコミットしました。"
            echo
            echo "**公開サイトにはまだ反映されていません。** 手元で次を実行してください。"
            echo
            echo '```bash'
            echo "git pull"
            echo "python pipeline/embeddings_store.py pull   # 既存の埋め込みを再利用するため"
            echo "export GEMINI_API_KEY=...   # 本文が変わった分の埋め込みを取り直す"
            echo "python pipeline/build_index.py && python pipeline/build_embeddings.py"
            echo "python pipeline/embeddings_store.py push   # マニフェストをコミットする"
            echo "git push"
            echo "gcloud builds triggers run jaf-regulations-deploy --branch=main --region=global"
            echo '```'
            echo
            echo "> \`gcloud run deploy --source .\` は使わないこと。毎回 100MB 超を"
            echo "> アップロードします。トリガーは Cloud Build が GitHub から直接"
            echo "> クローンするのでアップロードが 0 です（docs/deploy.md 4-5）。"
            echo
            python pipeline/build_history.py --github-summary --days 14
            echo
            echo "デプロイ後の確認:"
            echo
            echo '```bash'
            echo "curl -s https://jp.motorsports-regulations.org/api/healthz | python3 -m json.tool"
            echo '```'
            echo
            echo "\`docsWith\` に 0 が無いこと、\`seo.sitemapUrls\` が 100 以上あることを見ます。"
            echo "（ビルドの「中身を確認」ステップでも同じことを検査しています）"
            echo
            echo "コミット: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/$(git rev-parse HEAD)"
            echo "実行ログ: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/issue.md
          # Issue が作れなくても同期自体は成功しているので、ジョブは落とさない
          gh issue create \
            --title "規則が更新されました（$(date -u +%Y-%m-%d)）" \
            --body-file /tmp/issue.md || {
              echo "Issue を作れませんでした。ジョブサマリに要約は出ています。"
            }
